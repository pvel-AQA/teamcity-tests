name: Run tests

on: [ push, workflow_dispatch ]

jobs:
  run_tests:
    name: Run tests on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Pull and cache browser images
        uses: ./.github/actions/pull-and-cache-browsers

      - name: Setup TeamCity for CI
        id: setup_teamcity
        uses: ./.github/actions/setup-teamcity-ci
        with:
          teamcity-backup-url: ${{ secrets.TEAMCITY_BACKUP_URL }}
          docker-compose-dir: infra/docker_compose

      - name: Wait for agent synchronization
        run: sleep 300

      - name: Run tests
        run: ./mvnw test -P all -q -Dbrowser=${{ matrix.browser }}
        env:
          APIBASEURL: http://localhost:8111
          API_PREFIX: /app/rest
          UIBASEURL: http://teamcity-server:8111
          UIREMOTE: http://localhost:4444/wd/hub
          TEAMCITY_AUTH_TOKEN: ${{ steps.setup_teamcity.outputs.teamcity_token }}

      - name: Create Allure Environment properties
        if: always()
        run: |
          mkdir -p target/allure-results
          echo "Browser=${{ matrix.browser }}" >> target/allure-results/environment.properties
          echo "Runner=GitHub Actions" >> target/allure-results/environment.properties

      - name: Run Swagger Coverage
        if: always()
        run: .swagger-coverage-commandline/bin/swagger-coverage-commandline -s teamcity-swagger-filtered_p1.json -i target/swagger-coverage-output

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results
          retention-days: 1

      - name: Clean up services
        if: always()
        run: cd infra/docker_compose && docker compose -p teamcity down

  publish_report:
    name: Generate and Publish Allure Report & QA Dashboard
    needs: [ run_tests ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all Allure artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: target/allure-results-temp

      - name: Merge Allure results
        run: |
          mkdir -p target/allure-results
          cp -r target/allure-results-temp/*/* target/allure-results/ 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        if: always()
        with:
          python-version: '3.11'

      - name: Generate QA Quality Metrics Dashboard
        if: always()
        run: python .github/scripts/generate_metrics.py

      - name: Load test report history
        uses: actions/checkout@v7
        if: always()
        with:
          ref: gh-pages
          path: gh-pages

      # 1. Сначала Allure генерирует папку allure-history
      - name: Build test report
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        with:
          gh_pages: gh-pages
          allure_results: target/allure-results
          allure_history: allure-history

      # 2. Вставляем дашборд метрик прямо внутрь сформированной папки allure-history
      - name: Inject Quality Dashboard into Allure History
        if: always()
        run: |
          sudo mkdir -p allure-history/quality
          sudo cp -r target/quality-dashboard/* allure-history/quality/
          sudo touch allure-history/.nojekyll

      # 3. Публикуем итоговую директорию allure-history со всеми отчетами и дашбордом
      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

  notify:
    name: Telegram notification
    needs: [ run_tests, publish_report ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            <b>${{ needs.run_tests.result == 'success' && '✅ Passed' || '❌ Failed' }}</b> — TeamCity tests
            Branch: <code>${{ github.ref_name }}</code>
            Commit: ${{ github.actor }} — ${{ github.event.head_commit.message }}
            
            <b>📊 Reports:</b>
            • <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/quality/">Quality Metrics Dashboard</a>
            • <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/index.html">Allure Report #${{ github.run_number }}</a>
            
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run &amp; logs</a>
