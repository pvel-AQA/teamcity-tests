name: Run tests

on: [ push, workflow_dispatch ]

jobs:
  run_tests:
    name: Run tests on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Pull and cache browser images
        uses: ./.github/actions/pull-and-cache-browsers

      - name: Setup TeamCity for CI
        id: setup_teamcity
        uses: ./.github/actions/setup-teamcity-ci
        with:
          teamcity-backup-url: ${{ secrets.TEAMCITY_BACKUP_URL }}
          docker-compose-dir: infra/docker_compose

      - name: Wait for agent synchronization
        run: sleep 300

      - name: Run tests
        run: ./mvnw clean test -P all -q -Dbrowser=${{ matrix.browser }}
        env:
          APIBASEURL: http://localhost:8111
          API_PREFIX: /app/rest
          UIBASEURL: http://teamcity-server:8111
          UIREMOTE: http://localhost:4444/wd/hub
          TEAMCITY_AUTH_TOKEN: ${{ steps.setup_teamcity.outputs.teamcity_token }}

      - name: Run Swagger Coverage
        if: always()
        run: .swagger-coverage-commandline/bin/swagger-coverage-commandline -s teamcity-swagger-filtered_p1.json -i target/swagger-coverage-output

      # ✅ СОХРАНЯЕМ результаты для каждого браузера в отдельную папку
      - name: Save Allure results for ${{ matrix.browser }}
        if: always()
        run: |
          mkdir -p allure-results-${{ matrix.browser }}
          cp -r target/allure-results/* allure-results-${{ matrix.browser }}/

      - name: Upload Allure results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results-${{ matrix.browser }}

      - name: Clean up services
        if: always()
        run: cd infra/docker_compose && docker compose -p teamcity down

  # ✅ НОВЫЙ JOB: Объединяет результаты и генерирует отчет
  generate_report:
    name: Generate combined Allure report
    needs: [ run_tests ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout gh-pages for history
        uses: actions/checkout@v7
        if: always()
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download Allure results for all browsers
        uses: actions/download-artifact@v4
        with:
          path: all-results
          pattern: allure-results-*
          merge-multiple: true

      - name: Build test report
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        with:
          gh_pages: gh-pages
          allure_results: all-results
          allure_history: allure-history

      - name: Copy Swagger Coverage report
        if: always()
        run: |
          # Скачиваем swagger из первого job (они одинаковые)
          mkdir -p allure-history/${{ github.run_number }}

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

  notify:
    name: Telegram notification
    needs: [ run_tests, generate_report ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            <b>${{ needs.run_tests.result == 'success' && '✅ Passed' || '❌ Failed' }}</b> — Teamcity tests
            Branch: <code>${{ github.ref_name }}</code>
            Commit: ${{ github.actor }} — ${{ github.event.head_commit.message }}

            <b>📊 Reports:</b>
            Allure Report: <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/index.html">${{ github.event.repository.name }} Allure</a>
            Swagger Coverage: <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/swagger-coverage-report.html">Swagger Coverage</a>
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run &amp; logs</a>
