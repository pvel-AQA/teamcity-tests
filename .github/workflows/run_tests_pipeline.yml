name: Run tests

on: [ push, workflow_dispatch ]

jobs:
  run_tests:
    name: Set up services (review apps) and run tests on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.mvn/wrapper
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Pull and cache browser images
        uses: ./.github/actions/pull-and-cache-browsers

      - name: Setup TeamCity for CI
        id: setup_teamcity
        uses: ./.github/actions/setup-teamcity-ci
        with:
          teamcity-backup-url: ${{ secrets.TEAMCITY_BACKUP_URL }}
          docker-compose-dir: infra/docker_compose

      - name: Wait for TeamCity Agent synchronization and readiness
        run: |
          echo "Starting TeamCity Agent status check..."

          TIMEOUT=300
          ELAPSED=0
          INTERVAL=10

          while [ $ELAPSED -lt $TIMEOUT ]; do
            # 1. Request the current agent status, forcing a server cache refresh.
            AGENTS_JSON=$(curl -s -H "Accept: application/json" -u "admin:admin" \
              "http://localhost:8111/app/rest/agents?locator=defaultFilter:false&fields=agent(id,name,connected,authorized,upgrading,enabled)" || echo "{}")
          
            # 2. Extracting agent parameters
            AGENT_ID=$(echo "$AGENTS_JSON" | jq -r '.agent[0].id // empty')
            CONNECTED=$(echo "$AGENTS_JSON" | jq -r '.agent[0].connected // false')
            AUTHORIZED=$(echo "$AGENTS_JSON" | jq -r '.agent[0].authorized // false')
            UPGRADING=$(echo "$AGENTS_JSON" | jq -r '.agent[0].upgrading // false')

            if [ -z "$AGENT_ID" ]; then
              echo "⏳ [$ELAPSED s] No agents found yet in TeamCity..."
            else
              echo "⏳ [$ELAPSED s] Agent #$AGENT_ID -> connected: $CONNECTED | authorized: $AUTHORIZED | upgrading: $UPGRADING"
          
              # 3. Authorize the agent as soon as it connects (while it is still downloading plugins).
              if [ "$CONNECTED" = "true" ] && [ "$AUTHORIZED" = "false" ]; then
                echo "🔑 Authorizing Agent #$AGENT_ID via REST API..."
                curl -s -X PUT -u "admin:admin" \
                  -H "Content-Type: text/plain" \
                  -d "true" \
                  "http://localhost:8111/app/rest/agents/id:$AGENT_ID/authorized"
                echo ""
              fi

              # 4. Condition of full readiness
              if [ "$CONNECTED" = "true" ] && [ "$AUTHORIZED" = "true" ] && [ "$UPGRADING" = "false" ]; then
                echo "✅ Agent flags are READY! Waiting 100s for pool assignment and capabilities discovery..."
          
                # Pause to allow TeamCity time to place the agent in the pool and register its tools
                sleep 100

                echo "🚀 TeamCity Agent #$AGENT_ID is FULLY READY for build runs!"
                exit 0
              fi
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "❌ Timeout ($TIMEOUT sec) reached. Agent status dump:"
          echo "$AGENTS_JSON" | jq .
          exit 1

      - name: Run tests
        run: ./mvnw test -P all -q -Dbrowser=${{ matrix.browser }}
        env:
          APIBASEURL: http://localhost:8111
          API_PREFIX: /app/rest
          UIBASEURL: http://teamcity-server:8111
          UIREMOTE: http://localhost:4444/wd/hub
          HEADLESS: false
          TEAMCITY_AUTH_TOKEN: ${{ steps.setup_teamcity.outputs.teamcity_token }}

      - name: Run Swagger Coverage
        if: always() && matrix.browser == 'chrome'
        run: .swagger-coverage-commandline/bin/swagger-coverage-commandline -s teamcity-swagger-filtered_p1.json -i target/swagger-coverage-output

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results
          retention-days: 1

      - name: Upload Swagger Coverage Artifact
        if: always() && matrix.browser == 'chrome'
        uses: actions/upload-artifact@v4
        with:
          name: swagger-coverage
          path: swagger-coverage-report.html
          retention-days: 1

      - name: Clean up services
        if: always()
        run: cd infra/docker_compose && docker compose -p teamcity down

  publish_report:
    name: Generate and Publish Allure Report
    needs: [ run_tests ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all Allure artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: target/allure-results-temp

      - name: Download Swagger artifact
        uses: actions/download-artifact@v4
        if: always()
        with:
          name: swagger-coverage
          path: target/swagger-temp

      - name: Merge Allure results
        run: |
          mkdir -p target/allure-results
          cp -r target/allure-results-temp/*/* target/allure-results/ 2>/dev/null || true

      - name: Create Allure Environment properties
        if: always()
        run: |
          echo "UI browsers=Chrome, Firefox" >> target/allure-results/environment.properties
          echo "Runner=GitHub Actions" >> target/allure-results/environment.properties

      - name: Load test report history
        uses: actions/checkout@v7
        if: always()
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        with:
          gh_pages: gh-pages
          allure_results: target/allure-results
          allure_history: allure-history

      - name: Copy Swagger Coverage to Allure Run Dir
        if: always()
        run: |
          sudo chown -R $USER:$USER allure-history
          mkdir -p allure-history/${{ github.run_number }}
          cp target/swagger-temp/swagger-coverage-report.html allure-history/${{ github.run_number }}/swagger-coverage-report.html 2>/dev/null || true
          touch allure-history/.nojekyll

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

  notify:
    name: Telegram notification
    needs: [ run_tests, publish_report ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            <b>${{ needs.run_tests.result == 'success' && '✅ Passed' || '❌ Failed' }}</b> — TeamCity tests
            Branch: <code>${{ github.ref_name }}</code>
            Commit: ${{ github.actor }} — ${{ github.event.head_commit.message }}
            
            <b>📊 Reports:</b>
            • <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/index.html">Allure Report #${{ github.run_number }}</a>
            • <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/swagger-coverage-report.html">Swagger Coverage</a>
            
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run &amp; logs</a>
