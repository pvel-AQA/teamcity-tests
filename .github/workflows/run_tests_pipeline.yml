name: Run tests

on: [ push, workflow_dispatch ]

jobs:
  run_tests:
    name: Run tests on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Pull and cache browser images
        uses: ./.github/actions/pull-and-cache-browsers

      - name: Setup TeamCity for CI
        id: setup_teamcity
        uses: ./.github/actions/setup-teamcity-ci
        with:
          teamcity-backup-url: ${{ secrets.TEAMCITY_BACKUP_URL }}
          docker-compose-dir: infra/docker_compose

      - name: Wait for agent synchronization
        run: sleep 300

      - name: Run tests
        run: |
          # По умолчанию запускаем UI-тесты для текущего браузера из матрицы
          MAVEN_ARGS="-Dbrowser=${{ matrix.browser }}"
          
          # Если это Firefox (или любой другой отличный от chrome), исключаем пакет с API-тестами
          if [ "${{ matrix.browser }}" != "chrome" ]; then
            MAVEN_ARGS="$MAVEN_ARGS -Dtest=!api.**"
          fi
          
          # Запускаем тесты с сформированными аргументами
          ./mvnw clean test -P all -q $MAVEN_ARGS
        env:
          APIBASEURL: http://localhost:8111
          API_PREFIX: /app/rest
          UIBASEURL: http://teamcity-server:8111
          UIREMOTE: http://localhost:4444/wd/hub
          HEADLESS: false
          TEAMCITY_AUTH_TOKEN: ${{ steps.setup_teamcity.outputs.teamcity_token }}

      - name: Run Swagger Coverage
        if: always()
        run: .swagger-coverage-commandline/bin/swagger-coverage-commandline -s teamcity-swagger-filtered_p1.json -i target/swagger-coverage-output

      # Сохраняем результаты тестов текущего браузера как артефакт
      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results/
          retention-days: 1

      # Сохраняем Swagger отчет текущего браузера (если они нужны раздельно)
      - name: Upload Swagger Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swagger-report-${{ matrix.browser }}
          path: swagger-coverage-report.html
          retention-days: 1

      - name: Clean up services
        if: always()
        run: cd infra/docker_compose && docker compose -p teamcity down

  generate_report:
    name: Build & Publish Consolidated Allure 3 Report
    needs: [ run_tests ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # 1. Создаем чистую папку для результатов матрицы
      - name: Create Results Directory
        run: mkdir -p combined-allure-results

      # 2. Скачиваем результаты ВСЕХ браузеров из матрицы в одну папку
      - name: Download All Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: combined-allure-results
          merge-multiple: true

      # 3. Скачиваем текущую историю и прошлые отчеты из ветки gh-pages
      #- name: Load test report history
      #  uses: actions/checkout@v6
      #  with:
      #    ref: gh-pages
      #    path: gh-pages

      # 4. Настраиваем Node.js (нужен для Allure 3 CLI и вашего JS-конфига)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      # Инициализируем пустой файл истории, если кэш еще не создан
      - name: Initialize history file
        run: |
          mkdir -p allure-history
          touch allure-history/history.jsonl

      # Восстанавливаем или сохраняем файл истории Allure 3
      - name: Allure 3 History Cache
        uses: actions/cache@v4
        with:
          path: allure-history/history.jsonl
          key: allure3-history-${{ github.ref_name }}
          restore-keys: |
            allure3-history-

      # 5. Устанавливаем Allure 3 глобально и локально для работы ES-модулей в конфиге
      # npm install allure --no-save Позволит вашему allurerc.js успешно импортировать 'defineConfig'
      - name: Install Allure 3 CLI
        run: |
          npm install -g allure
          npm install allure --no-save
        # npm install allure @allurereport/plugin-awesome --no-save

      # 6. Подготавливаем базовую структуру (БЕЗ создания вложенной папки awesome)
      - name: Prepare History and Directories
        run: |
          # Если в сохраненных отчетах gh-pages уже есть история, копируем её для сохранения трендов
          if [ -f gh-pages/allure-history/history.jsonl ]; then
            cp gh-pages/allure-history/history.jsonl allure-history/history.jsonl
          fi

      # 7. Генерируем отчет с флагом --clean
      - name: Generate Allure Report
        run: |
          rm -rf allure-report
          allure generate combined-allure-results \
          --config allurerc.js \
          --output allure-report || {
            echo "Allure report generation failed!"
            echo "Looking for latest log file..."
            LATEST_LOG=$(ls -t /home/runner/.allure/logs/*.log 2>/dev/null | head -1)
            if [ -n "$LATEST_LOG" ]; then
              echo "=== Allure Log Content ==="
              cat "$LATEST_LOG"
              echo "=========================="
            else
              echo "No log file found!"
            fi
            exit 1
          }

      # 8. Скачиваем Swagger отчет (например, от chrome) для публикации
      - name: Download Swagger Report
        uses: actions/download-artifact@v4
        with:
          name: swagger-report-chrome
          path: .

      # 9. Копируем Swagger отчет в папку текущего запуска рядом с индексом Allure
      - name: Build Swagger Coverage report
        run: |
          mkdir -p allure-history/${{ github.run_number }}
          sudo cp swagger-coverage-report.html allure-history/${{ github.run_number }}/

      # 10. Копируем все старые папки запусков из gh-pages в allure-history,
      # чтобы не стереть прошлую историю на сайте
      - name: Copy existing runs to deployment directory
        run: |
          mkdir -p gh-pages
          rsync -av --exclude='history.jsonl' gh-pages/ allure-history/
          rm -rf allure-history/gh-pages 2>/dev/null || true

      # 11. Публикуем обновленную папку (все раны + свежий отчет + файл истории) на GitHub Pages
      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

  notify:
    name: Telegram notification
    needs: [ run_tests ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            <b>${{ needs.run_tests.result == 'success' && '✅ Passed' || '❌ Failed' }}</b> — Teamcity tests
            Branch: <code>${{ github.ref_name }}</code>
            Commit: ${{ github.actor }} — ${{ github.event.head_commit.message }}

            <b>📊 Reports:</b>
            Allure Report: <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/index.html">${{ github.event.repository.name }} Allure</a>
            Swagger Coverage: <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/swagger-coverage-report.html">Swagger Coverage</a>
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run &amp; logs</a>
