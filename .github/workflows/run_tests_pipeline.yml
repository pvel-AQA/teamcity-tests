name: Run tests

on: [ push, workflow_dispatch ]

# stages analogy
jobs:
  run_tests:
    name: Set up services (review apps) and run tests
    runs-on: ubuntu-latest
    outputs:
      telegram_block: ${{ steps.quality.outputs.telegram_block }}
      dashboard_url: ${{ steps.quality.outputs.dashboard_url }}
      gate_icon: ${{ steps.quality.outputs.gate_icon }}
      gate_verdict: ${{ steps.quality.outputs.gate_verdict }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Pull and cache browser images
        uses: ./.github/actions/pull-and-cache-browsers

      - name: Setup TeamCity for CI
        id: setup_teamcity
        uses: ./.github/actions/setup-teamcity-ci
        with:
          teamcity-backup-url: ${{ secrets.TEAMCITY_BACKUP_URL }}
          docker-compose-dir: infra/docker_compose

      - name: Wait for agent synchronization
        run: sleep 300

      - name: Run tests
        run: ./mvnw clean test -P all -q
        env:
          APIBASEURL: http://localhost:8111
          API_PREFIX: /app/rest
          UIBASEURL: http://teamcity-server:8111
          UIREMOTE: http://localhost:4444/wd/hub
          HEADLESS: false
          TEAMCITY_AUTH_TOKEN: ${{ steps.setup_teamcity.outputs.teamcity_token }}

      - name: Run Swagger Coverage
        if: always()
        run: .swagger-coverage-commandline/bin/swagger-coverage-commandline -s teamcity-swagger-filtered_p1.json -i target/swagger-coverage-output

      - name: Load test report history
        uses: actions/checkout@v7
        if: always()
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        with:
          gh_pages: gh-pages
          allure_results: target/allure-results
          allure_history: allure-history

      - name: Build Swagger Coverage report
        if: always()
        run: |
          sudo cp swagger-coverage-report.html allure-history/${{ github.run_number }}
          # Publish the machine-readable results too, so coverage can be trended.
          sudo cp swagger-coverage-results.json allure-history/${{ github.run_number }}

      - name: Build UI route coverage
        if: always()
        # Reporting layer, same rule as the dashboard: it must never turn a green test
        # run red. If it fails, the dashboard renders its UI coverage card as
        # unavailable rather than showing stale numbers.
        continue-on-error: true
        # Static analysis over src/, so it needs no test results and cannot be affected
        # by a failing run. Publishes next to the Swagger report for the same run.
        run: |
          python3 scripts/build_route_coverage.py \
            --out ui-route-coverage.html \
            --json ui-route-coverage.json
          # allure-history is created by the Allure action as root, so copy in with sudo
          # exactly like the Swagger report above. The chown happens a step later.
          sudo cp ui-route-coverage.html allure-history/${{ github.run_number }}/

      - name: Build quality dashboard
        id: quality
        if: always()
        # Reporting layer: a dashboard problem must never turn a green test run red.
        # The step still shows as failed in the UI, and Telegram degrades to no metrics block.
        continue-on-error: true
        run: |
          # One dashboard per branch, so a teammate's push cannot overwrite yours.
          # feature/foo -> feature-foo; anything outside [alnum]._- is dropped.
          SLUG=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr -cd '[:alnum:]._-')
          SLUG=${SLUG:-unnamed}
          # The Allure action writes as root; take ownership so the generator can write.
          sudo chown -R "$(id -u):$(id -g)" allure-history
          # Carry the rolling history forward - it outlives Allure's 20-report retention.
          # Copying the whole quality/ tree also keeps sibling branches' dashboards alive:
          # the publish step prunes anything absent from allure-history.
          if [ -d gh-pages/quality ]; then
            mkdir -p allure-history/quality
            cp -r gh-pages/quality/. allure-history/quality/
          fi
          python3 scripts/build_quality_dashboard.py \
            --site-dir allure-history \
            --gates quality-gates.json \
            --destination "quality/$SLUG" \
            --repo ${{ github.repository }} \
            --run-number ${{ github.run_number }} \
            --swagger-results swagger-coverage-results.json \
            --ui-coverage ui-route-coverage.json \
            --pages-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --markdown-out quality-summary.md \
            --github-output "$GITHUB_OUTPUT"
          cat quality-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Flag dashboard failure
        # The dashboard step is continue-on-error so a reporting problem never turns a
        # green test run red. That used to make its failure invisible: the job stayed
        # green and Telegram rendered an empty href. Surface it explicitly instead.
        if: always() && steps.quality.outcome == 'failure'
        run: |
          echo "::error title=Quality dashboard::The dashboard step failed - no report was \
          published for run #${{ github.run_number }}. The notification will say so."
          {
            echo "## :warning: Quality Report unavailable"
            echo "The dashboard step failed for run #${{ github.run_number }}."
            echo "Test results above are unaffected."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          # gh-pages is shared: teammates run this pipeline from their own branches and
          # publish their own allure-history. The default (replace the branch contents)
          # means their deploy deletes anything absent from it - which is how the
          # quality/ dashboard tree and <run>/quality.html kept disappearing hours after
          # a green run published them. Merging in leaves siblings' files alone.
          keep_files: true

      - name: Clean up services
        if: always()
        run: cd infra/docker_compose && docker compose -p teamcity down

  notify:
    name: Telegram notification
    needs: [ run_tests ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            <b>${{ needs.run_tests.result == 'success' && '✅ Passed' || '❌ Failed' }}</b> — Teamcity tests
            Branch: <code>${{ github.ref_name }}</code>
            Commit: ${{ github.actor }} — ${{ github.event.head_commit.message }}

            ${{ needs.run_tests.outputs.telegram_block }}

            <b>📊 Reports:</b>
            ${{ needs.run_tests.outputs.dashboard_url && format('Quality Report: <a href="{0}">Summary dashboard</a>', needs.run_tests.outputs.dashboard_url) || '⚠️ Quality Report: unavailable — the dashboard step failed for this run' }}
            Allure Report: <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/index.html">${{ github.event.repository.name }} Allure</a>
            Swagger Coverage: <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/swagger-coverage-report.html">Swagger Coverage</a>
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run &amp; logs</a>
