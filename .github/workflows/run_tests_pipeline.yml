name: Run tests

on: [ push, workflow_dispatch ]

jobs:
  run_tests:
    name: Run tests on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Pull and cache browser images
        uses: ./.github/actions/pull-and-cache-browsers

      - name: Setup TeamCity for CI
        id: setup_teamcity
        uses: ./.github/actions/setup-teamcity-ci
        with:
          teamcity-backup-url: ${{ secrets.TEAMCITY_BACKUP_URL }}
          docker-compose-dir: infra/docker_compose

      - name: Wait for agent synchronization
        run: sleep 300

      - name: Run tests
        run: |
          # По умолчанию запускаем UI-тесты для текущего браузера из матрицы
          MAVEN_ARGS="-Dbrowser=${{ matrix.browser }}"
          
          # Если это Firefox (или любой другой отличный от chrome), исключаем пакет с API-тестами
          if [ "${{ matrix.browser }}" != "chrome" ]; then
            MAVEN_ARGS="$MAVEN_ARGS -Dtest=!api.**"
          fi
          
          # Запускаем тесты с сформированными аргументами
          ./mvnw clean test -P api -q -Dsurefire.rerunFailingTestsCount=3 $MAVEN_ARGS
        env:
          APIBASEURL: http://localhost:8111
          API_PREFIX: /app/rest
          UIBASEURL: http://teamcity-server:8111
          UIREMOTE: http://localhost:4444/wd/hub
          HEADLESS: false
          TEAMCITY_AUTH_TOKEN: ${{ steps.setup_teamcity.outputs.teamcity_token }}

      - name: Run Swagger Coverage
        if: always()
        run: .swagger-coverage-commandline/bin/swagger-coverage-commandline -s teamcity-swagger-filtered_p1.json -i target/swagger-coverage-output

      # Сохраняем результаты тестов текущего браузера как артефакт
      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results/
          retention-days: 1

      # Сохраняем Swagger отчет текущего браузера (если они нужны раздельно)
      - name: Upload Swagger Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swagger-report-${{ matrix.browser }}
          path: swagger-coverage-report.html
          retention-days: 1

      - name: Clean up services
        if: always()
        run: cd infra/docker_compose && docker compose -p teamcity down

  generate_report:
    name: Build & Publish Consolidated Allure 3 Report
    needs: [ run_tests ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Allure 3 CLI
        run: |
          npm install -g allure
          npm install allure --no-save

      # 1. Создаем структуру для истории, если её нет
      - name: Prepare history directory
        run: |
          echo "🧹 Cleaning all Allure artifacts from previous runs..."
          rm -rf allure-history
          rm -rf allure-report
          rm -rf combined-allure-results
          rm -rf /home/runner/.allure
          rm -rf /home/runner/.cache/allure
          rm -rf /tmp/allure-*
          rm -rf .allure
          rm -f *.lock
          mkdir -p allure-history
        continue-on-error: true

      # 2. Загружаем историю из артефактов предыдущего запуска
      - name: Download previous history
        uses: actions/download-artifact@v4
        with:
          name: allure-history
          path: allure-history/
        continue-on-error: true

      # 3. Создаем папку для результатов матрицы
      - name: Create Results Directory
        run: mkdir -p combined-allure-results

      # 4. Скачиваем результаты ВСЕХ браузеров из матрицы в одну папку
      - name: Download All Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: combined-allure-results
          merge-multiple: true

      # 5. Настраиваем Node.js (нужен для Allure 3 CLI)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      # 6. Генерируем отчет с сохранением истории
      - name: Generate Allure Report
        run: |
          # Создаем папку для текущего запуска
          mkdir -p allure-history/${{ github.run_number }}
          
          # Удаляем старый отчет, если есть
          rm -rf allure-report
          
          # Генерируем отчет
          allure generate combined-allure-results \
            --config allurerc.js \
            --output allure-history/${{ github.run_number }} || {
            echo "❌ Allure report generation failed!"
            echo "Looking for latest log file..."
            LATEST_LOG=$(ls -t /home/runner/.allure/logs/*.log 2>/dev/null | head -1)
            if [ -n "$LATEST_LOG" ]; then
              echo "=== Allure Log Content ==="
              cat "$LATEST_LOG"
              echo "=========================="
            else
              echo "No log file found!"
            fi
            exit 1
          }
          
          # Проверяем результат
          if [ -f "allure-history/${{ github.run_number }}/index.html" ]; then
            echo "✅ Report generated successfully"
          else
            echo "❌ Report generation failed - index.html not found"
            exit 1
          fi

      # 7. Скачиваем Swagger отчет (например, от chrome) для публикации
      - name: Download Swagger Report
        uses: actions/download-artifact@v4
        with:
          name: swagger-report-chrome
          path: .
          continue-on-error: true

      # 8. Копируем Swagger отчет в папку текущего запуска
      - name: Copy Swagger Coverage report
        run: |
          mkdir -p allure-history/${{ github.run_number }}
          sudo cp swagger-coverage-report.html allure-history/${{ github.run_number }}

      # 9. Обновляем файл истории с текущим запуском
      - name: Update history file
        run: |
          cd allure-history
          # Добавляем информацию о текущем запуске в историю
          RUN_INFO="{\"runNumber\": ${{ github.run_number }}, \"timestamp\": \"$(date -Iseconds)\", \"branch\": \"${{ github.ref_name }}\"}"
          
          if [ -f "history.jsonl" ]; then
            # Если файл существует, добавляем новую запись
            echo "$RUN_INFO" >> history.jsonl
          else
            # Если файла нет, создаем новый
            echo "$RUN_INFO" > history.jsonl
          fi
          echo "✅ History updated with run ${{ github.run_number }}"

      # 10. Сохраняем историю как артефакт для следующего запуска
      - name: Save Allure history
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: allure-history/
          retention-days: 10

      # 11. Публикуем обновленную папку на GitHub Pages
      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true

  notify:
    name: Telegram notification
    needs: [ run_tests ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            <b>${{ needs.run_tests.result == 'success' && '✅ Passed' || '❌ Failed' }}</b> — Teamcity tests
            Branch: <code>${{ github.ref_name }}</code>
            Commit: ${{ github.actor }} — ${{ github.event.head_commit.message }}

            <b>📊 Reports:</b>
            Allure Report: <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/index.html">${{ github.event.repository.name }} Allure</a>
            Swagger Coverage: <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/swagger-coverage-report.html">Swagger Coverage</a>
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run &amp; logs</a>
