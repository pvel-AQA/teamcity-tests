name: Run tests

on: [ push, workflow_dispatch ]

jobs:
  run_tests:
    name: Run tests on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Pull and cache browser images
        uses: ./.github/actions/pull-and-cache-browsers

      - name: Setup TeamCity for CI
        id: setup_teamcity
        uses: ./.github/actions/setup-teamcity-ci
        with:
          teamcity-backup-url: ${{ secrets.TEAMCITY_BACKUP_URL }}
          docker-compose-dir: infra/docker_compose

      - name: Wait for agent synchronization
        run: sleep 300

      - name: Run tests
        run: ./mvnw clean test -P all -q -Dbrowser=${{ matrix.browser }}
        env:
          APIBASEURL: http://localhost:8111
          API_PREFIX: /app/rest
          UIBASEURL: http://teamcity-server:8111
          UIREMOTE: http://localhost:4444/wd/hub
          TEAMCITY_AUTH_TOKEN: ${{ steps.setup_teamcity.outputs.teamcity_token }}

      - name: Run Swagger Coverage
        if: always()
        run: .swagger-coverage-commandline/bin/swagger-coverage-commandline -s teamcity-swagger-filtered_p1.json -i target/swagger-coverage-output

      - name: Load test report history
        uses: actions/checkout@v7
        if: always()
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report for ${{ matrix.browser }}
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        with:
          gh_pages: gh-pages
          allure_results: target/allure-results
          allure_history: allure-history-${{ matrix.browser }}

      - name: Move reports to run folder with browser subfolder
        if: always()
        run: |
          # Создаем папку для текущего запуска и браузера
          mkdir -p allure-history/${{ github.run_number }}/${{ matrix.browser }}
          # Копируем отчет браузера
          cp -r allure-history-${{ matrix.browser }}/* allure-history/${{ github.run_number }}/${{ matrix.browser }}

      - name: Build Swagger Coverage report
        if: always()
        run: sudo cp swagger-coverage-report.html allure-history/${{ github.run_number }}

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Clean up services
        if: always()
        run: cd infra/docker_compose && docker compose -p teamcity down

  create_index:
    name: Create main index page
    needs: [ run_tests ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Create main index page
        run: |
          mkdir -p gh-pages/${{ github.run_number }}
          
          cat > gh-pages/${{ github.run_number }}/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Test Reports - Run #${{ github.run_number }}</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { 
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                background: #f6f8fa;
                padding: 40px 20px;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
              }
              .container {
                max-width: 800px;
                width: 100%;
                background: white;
                border-radius: 16px;
                box-shadow: 0 8px 30px rgba(0,0,0,0.12);
                padding: 40px;
              }
              h1 {
                color: #24292e;
                font-size: 28px;
                margin-bottom: 8px;
              }
              .subtitle {
                color: #57606a;
                margin-bottom: 30px;
                font-size: 16px;
              }
              .badge {
                display: inline-block;
                background: #2da44e;
                color: white;
                padding: 4px 12px;
                border-radius: 20px;
                font-size: 14px;
                font-weight: 600;
                margin-bottom: 20px;
              }
              .browser-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
                margin-top: 20px;
              }
              .browser-card {
                background: #f6f8fa;
                border-radius: 12px;
                padding: 24px;
                text-align: center;
                transition: transform 0.2s, box-shadow 0.2s;
                border: 2px solid transparent;
              }
              .browser-card:hover {
                transform: translateY(-4px);
                box-shadow: 0 8px 20px rgba(0,0,0,0.08);
                border-color: #d0d7de;
              }
              .browser-icon {
                font-size: 48px;
                margin-bottom: 12px;
              }
              .browser-name {
                font-size: 20px;
                font-weight: 600;
                color: #24292e;
                margin-bottom: 8px;
              }
              .browser-link {
                display: inline-block;
                background: #2da44e;
                color: white;
                padding: 8px 24px;
                border-radius: 6px;
                text-decoration: none;
                font-weight: 500;
                margin-top: 12px;
                transition: background 0.2s;
              }
              .browser-link:hover {
                background: #2c974b;
              }
              .swagger-link {
                display: inline-block;
                background: #8250df;
                color: white;
                padding: 8px 24px;
                border-radius: 6px;
                text-decoration: none;
                font-weight: 500;
                margin-top: 12px;
                transition: background 0.2s;
              }
              .swagger-link:hover {
                background: #6f3fc9;
              }
              .footer {
                margin-top: 30px;
                padding-top: 20px;
                border-top: 1px solid #d0d7de;
                text-align: center;
                color: #57606a;
                font-size: 14px;
              }
              .footer a {
                color: #0969da;
                text-decoration: none;
              }
              .footer a:hover {
                text-decoration: underline;
              }
              @media (max-width: 600px) {
                .browser-grid {
                  grid-template-columns: 1fr;
                }
                .container {
                  padding: 20px;
                }
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>📊 Test Reports</h1>
              <div class="subtitle">Run #${{ github.run_number }} · ${{ github.sha }}</div>
              <div class="badge">✅ Completed</div>
          
              <div class="browser-grid">
                <div class="browser-card">
                  <div class="browser-icon">🌐</div>
                  <div class="browser-name">Google Chrome</div>
                  <a href="chrome/index.html" class="browser-link">View Report →</a>
                  <br>
                  <a href="chrome/swagger-coverage-report.html" class="swagger-link">📝 Swagger Coverage</a>
                </div>
                <div class="browser-card">
                  <div class="browser-icon">🦊</div>
                  <div class="browser-name">Firefox</div>
                  <a href="firefox/index.html" class="browser-link">View Report →</a>
                  <br>
                  <a href="firefox/swagger-coverage-report.html" class="swagger-link">📝 Swagger Coverage</a>
                </div>
              </div>
          
              <div class="footer">
                <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View on GitHub Actions →</a>
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Publish index page
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages

  notify:
    name: Telegram notification
    needs: [ run_tests, create_index ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          message: |
            <b>${{ needs.run_tests.result == 'success' && '✅ Passed' || '❌ Failed' }}</b> — Teamcity tests
            Branch: <code>${{ github.ref_name }}</code>
            Commit: ${{ github.actor }} — ${{ github.event.head_commit.message }}

            <b>📊 Reports:</b>
            Main Allure: <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/index.html">All Reports</a>
            Chrome: <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/chrome/index.html">Chrome</a>
            Firefox: <a href="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/firefox/index.html">Firefox</a>
            
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run &amp; logs</a>
