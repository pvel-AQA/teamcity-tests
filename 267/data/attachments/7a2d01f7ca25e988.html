        <script>
          (function() {
            const Theme = {DARK: 'dark', LIGHT: 'light'}
            const storageKey = 'tc:lastTheme'
            const darkClass = 'ring-ui-theme-dark'
            const getStored = () => {
              try {
                return window.localStorage.getItem(storageKey)
              } catch {
                return null
              }
            }
            const prefersDark = () => {
              try {
                return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              } catch {
                return false
              }
            }
            const stored = getStored()
            const theme = stored === Theme.DARK || stored === Theme.LIGHT ? stored : prefersDark() ? Theme.DARK : Theme.LIGHT
            document.documentElement.classList.toggle(darkClass, theme === Theme.DARK)
          })();
        </script>
